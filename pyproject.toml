[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "master-thesis-person-retrieval"
version = "0.1.0"
description = "Runtime dependencies for the UP-Person, IRRA, and DM-Adapter research code."
requires-python = ">=3.10,<3.13"
dependencies = [
    "easydict>=1.11,<2",
    "ftfy>=6.1,<7",
    "numpy>=1.23,<3",
    "Pillow>=10,<13",
    "prettytable>=3.11,<4",
    "PyYAML>=6,<7",
    "regex>=2023.10,<2027",
    "tensorboard>=2.14,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# The pair is kept aligned with the tested PyTorch compatibility matrix.
torch = [
    "torch==2.4.1",
    "torchvision==0.19.1",
]

irra = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "matplotlib>=3.7,<4",
]

up-person = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "adapters>=1.2,<2",
    "thop>=0.1.1,<1",
    "timm>=0.5.4,<1",
    "pynvml>=11.5,<13",
]

dm-adapter = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "pynvml>=11.5,<13",
    "simple-parsing>=0.1.5,<2",
]

all = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "adapters>=1.2,<2",
    "matplotlib>=3.7,<4",
    "pynvml>=11.5,<13",
    "simple-parsing>=0.1.5,<2",
    "thop>=0.1.1,<1",
    "timm>=0.5.4,<1",
]

[tool.setuptools]
packages = []
